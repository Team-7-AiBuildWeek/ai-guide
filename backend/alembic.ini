[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# DATABASE_URL from the environment overrides this.
sqlalchemy.url = postgresql+psycopg://walk@localhost:5432/walk

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
